[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topspin-review"
version = "0.1.0"
description = "Analyze a racket-sport session video into a measured, evidence-based coaching report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "Pillow>=10",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4",
    # Runtime dependency provided by the host environment (not on PyPI): openjiuwen
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10"]
pdf = ["reportlab>=4"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2"]
web = ["streamlit>=1.36"]
dev = ["pytest>=7", "ruff>=0.6"]
all = [
    "mediapipe>=0.10",
    "reportlab>=4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=1.2",
    "streamlit>=1.36",
    "pytest>=7",
]

[project.scripts]
topspin-review = "topspin_review.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["topspin_review*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 handled by `ruff format`; B905 (zip strict) is a style preference.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
